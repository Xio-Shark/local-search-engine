[project]
name = "lse"
version = "0.2.0"
description = "Modern local full-text search engine with dynamic evidence resonance spans, code-aware tokenization, and formal query AST"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tantivy>=0.26,<0.27",
]

[project.scripts]
lse = "lse.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
