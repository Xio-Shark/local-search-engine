name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv pip install --system pyinstaller
          uv pip install --system -e .

      - name: Build with PyInstaller
        run: |
          pyinstaller --clean --noconfirm packaging/lse.spec

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p release
          ARCH=$(uname -m)
          tar -czf "release/lse-macos-${ARCH}-v${{ github.ref_name }}.tar.gz" -C dist lse

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release
          Compress-Archive -Path "dist\lse\*" -DestinationPath "release\lse-windows-amd64-${{ github.ref_name }}.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lse-${{ matrix.os }}
          path: release/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
